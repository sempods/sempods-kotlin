name: Refresh Context7

# Context7 indexes this repository's documentation so that coding agents answer questions about
# sempods from the docs rather than from a guess. Left alone it re-crawls "based on popularity",
# which for a project this size means rarely — and a rarely-refreshed index of a `0.x` contract is
# worse than none: it states last quarter's API with this quarter's confidence.
#
# So ask, on a schedule, and let any answer that is not success fail the run.
#
# **The schedule is the whole design.** The endpoint enforces a floor its documentation does not
# mention — `{"error":"too-early", ... "Minimum 10 days required between updates."}` — so a
# workflow that asks more often than that fails as a matter of course, and a run that is normally
# red tells you nothing on the day it is red for a real reason. Staying above the floor is what
# lets `--fail-with-body` mean something.
#
# `1,15` rather than an interval, because cron intervals do not survive month boundaries: `*/20`
# fires on the 1st and 21st, and 21 February to 1 March is eight days — inside the floor. Two fixed
# days of the month are never closer than fourteen (15 February to 1 March, the shortest pair).
#
# `37` past the hour: GitHub's own guidance is that scheduled runs on the hour are the ones delayed
# or dropped under load.
#
# The schedule spaces this workflow's own requests and nothing else, though — the floor counts from
# the last *update*. A manual dispatch that succeeds, or a popularity-driven re-crawl Context7 does
# on its own, resets it under a cron that cannot see either. So `too-early` stays possible, and it
# is the one answer that means the index is fresher than this run would have made it. Reporting
# that as a failure is a false alarm, and false alarms are how real ones stop being read.
#
# No `push` trigger. It would refresh a few days sooner after a merge and spend most runs being
# refused for it, which is the trade that made an earlier version of this file fail on every merge.
#
# Failure reaches a person by e-mail — GitHub notifies on a failed scheduled run — which is the
# only notification this needs. A stalled index is not urgent; it just must not be silent.
on:
  schedule:
    - cron: '37 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The secret comes from the Context7 dashboard, and is absent in forks — not a broken build.
      #
      # An expired key, a library name that stopped resolving and their outage all leave the index
      # frozen, and this workflow exists so that does not happen quietly. `too-early` is the
      # exception and the only one: it says the index is already fresher than this run would have
      # made it.
      - name: Trigger the re-crawl
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "CONTEXT7_API_KEY is not set — skipping the refresh."
            exit 0
          fi

          # No `--fail`: the body decides, and it can only do that if curl hands it over. A
          # transport failure still fails the step — `set -e` covers the assignment.
          body=$(curl -sS -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -d '{"libraryName": "/${{ github.repository }}"}' \
            -w '\n%{http_code}')
          echo "$body"

          # Status and body, both: matched with its quotes so the word in another field's prose
          # cannot silence a real rejection, and pinned to the 400 it arrives with so it cannot
          # excuse a 401 either. Every other non-2xx — a 400 this workflow built wrong included —
          # falls through to the failure.
          case "$body" in
            *$'\n'2??) echo "::notice::Context7 re-crawl started." ;;
            *'"too-early"'*$'\n'400) echo "::notice::Already refreshed inside Context7's ten-day floor." ;;
            *) echo "::error::Context7 refresh failed."; exit 1 ;;
          esac
