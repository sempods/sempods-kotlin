name: Publish snapshot

# Every merge to `main` republishes the version `gradle.properties` currently names, as long as it
# is a `-SNAPSHOT`. A downstream project follows snapshots to
# find out early that something changed, and one that is refreshed by hand is refreshed until the
# first time someone forgets — after which it reports on a version nobody is running.
#
# `push` to `main` only. Pull requests must not publish: a snapshot is a single mutable version, so
# two branches publishing into it would overwrite each other and whoever consumed it last would
# have code that is on no branch at all.
on:
  push:
    branches: [ main ]

# Least privilege. Publishing reads the tree and writes to Central, not to this repository.
permissions:
  contents: read

# One publish at a time, and no cancelling: a publish killed halfway leaves the repository holding
# some modules from one commit beside some from another. Serialising is not ordering — GitHub runs a
# group in arbitrary order — so which commit ends up published is decided by the gate below, not
# here.
concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Not `./.github/actions/setup-test-environment`, which also starts MongoDB, Garage and the
      # rest of the compose stack. Nothing here runs a test, and the artifacts do not need them.
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6

      # No test run, because `main` cannot hold an untested commit: the ruleset requires `build` and
      # `check` to pass on the pull request, and its bypass list is empty. Re-running the suite here
      # would cost seven minutes to re-establish what merging already proved.
      #
      # No signing either. Central validates nothing about a snapshot and requires no signature, so
      # the key stays out of CI entirely — `SIGNING_KEY` is absent and the build skips signing.
      #
      # `ORG_GRADLE_PROJECT_x` is how Gradle reads a project property from the environment, which is
      # what `credentials(PasswordCredentials::class)` on the `centralSnapshots` repository asks for.
      # The token never reaches a file.
      # Two things make an unconditional publish wrong.
      #
      # A release puts a version without `-SNAPSHOT` on `main` (RELEASING.md, step 1), and the
      # snapshot repository takes only snapshots — every release would leave a red run behind.
      #
      # And a queued older run can reach this step after a newer one has already published, quietly
      # replacing the newer artifacts with stale ones. Concurrency serialises the group but does not
      # order it. Comparing against the current tip is what makes the newest commit the one that
      # survives.
      - name: Decide whether to publish
        id: gate
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          tip=$(git ls-remote origin refs/heads/main | cut -f1)

          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "main holds $version, a release — the snapshot repository does not take it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "$GITHUB_SHA is no longer the tip of main ($tip); that commit's run publishes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing $version from $GITHUB_SHA"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the Central snapshot repository
        if: steps.gate.outputs.publish == 'true'
        env:
          ORG_GRADLE_PROJECT_centralSnapshotsUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralSnapshotsPassword: ${{ secrets.CENTRAL_PASSWORD }}
        run: ./gradlew publishAllPublicationsToCentralSnapshotsRepository --max-workers=2
