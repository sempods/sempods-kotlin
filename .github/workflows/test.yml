name: Testing

# `pull_request` rather than `push` alone, for three reasons: a push from a fork triggers nothing
# in this repository, so a contribution would arrive untested; a PR opened on an
# already-pushed branch gets no fresh run; and `pull_request` tests the **merge result** against
# the base, whereas a push only tests the branch — a PR can be green and still break `main`.
#
# `push` stays for `main` so the merged state is verified. Feature branches are covered by their
# PR; open a draft PR to get CI on work in progress.
on:
  push:
    branches: [ main ]
  pull_request:

# A newer commit makes the previous run's answer irrelevant. Without this, a series of quick
# pushes leaves obsolete runs occupying the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege, and explicit because the default is repository-wide. `checks: write` is what
# the JUnit reporter needs to publish its check run.
permissions:
  contents: read
  checks: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-test-environment

      # `--max-workers=2`, against the four this runner would otherwise take. `gradle.properties`
      # pins four because that suits a developer machine; here it means four test JVMs, each with a
      # 2 GB heap booting Jetty, RDF4J and a Mongo pool, sharing four cores. Three of them were live
      # when an integration test timed out waiting on roughly a third of a core to run on — and a
      # starved suite fails by timing out, which reads like a bug in the test rather than a
      # shortage of CPU.
      #
      # This costs nothing measurable. Runs of this workflow vary by more than a minute on identical
      # code (main: 7m12s, 6m5s, 7m28s), which is wider than any difference two workers make, so
      # single-run comparisons here mean nothing and are not worth drawing conclusions from.
      # The four guards are named explicitly, because `test` schedules the suites and nothing
      # else: all four are wired into `check`, so none would run here, and a guard that only fires
      # on a developer's machine is one a pull request walks straight past. `checkNoLoggingBinding`
      # keeps a library from carrying the logback binding into a consumer's runtime — the one
      # dependency mistake a library is not forgiven, and invisible without a check.
      # `checkNoTestLibrariesInPom` reads the published POM, which nothing else in the build does,
      # and is what caught JUnit, kotlin-test and MockK reaching a Maven consumer at `runtime`
      # through the test-fixtures variant. `checkDocLinks` walks the markdown, which nothing else
      # reads at all, and catches the pointers left behind when a document moves or is retired.
      # `checkImageMetadata` reads the jib configuration, which nothing else touches, and
      # keeps a container image from shipping without the label that says which commit it is.
      # `checkPublishedSignatures` reads the client core's compiled classes, which nothing else
      # does, and is what keeps a Kotlin function type or an engine off the surface a Java consumer
      # compiles against — a mistake every module here is structurally unable to notice.
      #
      # Naming them beats running `check`, which pulls a couple of dozen extra tasks into the same
      # job and changes what runs concurrently with what. One is a classpath walk, one a POM read
      # and one a file scan; none of them needs `check`'s scheduling.
      - name: Run tests
        id: gradle_tests
        run: ./gradlew test checkNoLoggingBinding checkNoTestLibrariesInPom checkDocLinks checkImageMetadata checkPublishedSignatures --max-workers=2
        continue-on-error: true

      # Reporting must never decide the outcome. A pull request from a fork gets a read-only
      # token, so publishing the check run fails there — and without this the job would go red
      # while the tests themselves were green, which is exactly backwards for a contribution.
      # The verdict is the final step; the uploaded artifact carries the detail either way.
      - name: Publish JUnit Test Report
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          check_name: "JUnit Test Report"
          detailed_summary: true
          include_passed: false
          fail_on_failure: false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-reports
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if tests failed
        if: steps.gradle_tests.outcome == 'failure'
        run: exit 1

  # The api/implementation boundary, on every pull request.
  #
  # A separate job rather than another task on `build` above, for two reasons. That job runs its
  # Gradle invocation under `continue-on-error` so the JUnit reporter always gets to publish, and
  # a boundary violation folded into it would arrive as "the test step failed" — the one reading
  # that is looking for a broken test. And nothing here needs the compose stack: `buildHealth`
  # reads bytecode and Kotlin metadata, not a database.
  #
  # What it catches is the mistake #11 found six times: a type in a published module's public
  # signature that a consumer cannot reach, because the artifact carrying it is declared
  # `implementation`. Invisible from inside this repository, where every module has its own
  # dependencies on its own compile classpath, and fatal for the first stranger with the jar.
  #
  # It does not cover `sempods-auth` and `sempods-mcp` — the plugin treats a project carrying
  # `application` or Jib as an application and computes no ABI for one. Those two are covered by
  # `:consumer-probe:auth` and `:consumer-probe:mcp`, which compile against them the way a foreign
  # build would and therefore run as part of `test` above.
  build-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check dependency declarations
        run: ./gradlew buildHealth --max-workers=2

      - name: Upload dependency-analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-analysis-report
          path: build/reports/dependency-analysis/build-health-report.txt
          if-no-files-found: warn
          retention-days: 14

  # The published artifacts, consumed from outside this build. `build` proves the code works in the
  # repository it was written in; this proves the *jars* work in a build that holds nothing else —
  # no project dependency, no `~/.m2`, no source of this repository — and it is the only place a
  # JDK 21 process runs at all.
  #
  # The matrix is the consumer's JDK, not the producer's. Both entries install both JDKs: the
  # producer, Gradle and `buildHealth` stay on 25, and 21 is what compiles and runs the consumer in
  # the first entry. Bytecode built for 21 and executed only on 25 is what this job exists not to
  # be, so a green 25 entry is not a baseline on its own — `fail-fast: false` keeps the two answers
  # independent when one of them goes red.
  #
  # No compose stack: nothing here reaches a database, the same reason `build-health` does without.
  published-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    steps:
      - uses: actions/checkout@v7

      # Both, in this order. `setup-java` points `JAVA_HOME` at the last version it installs, which
      # is where every Gradle invocation in this job belongs; each install also exports
      # `JAVA_HOME_<version>_<arch>`, which is what the property below names. Nothing downloads a
      # JDK afterwards: there is no toolchain resolver plugin in this build, on purpose.
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      # The arm64 spellings sit beside the x64 ones because a runner image can change architecture
      # under a workflow, and an unset variable in this list is skipped rather than an error. `-P`,
      # not `-D`: Gradle reads toolchain configuration as a gradle property only. The root task
      # forwards this to the nested consumer build, which inherits nothing.
      - name: Consume the published artifacts on JDK ${{ matrix.java }}
        run: >
          ./gradlew checkPublishedArtifacts
          -PconsumerJdks=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64
          --max-workers=2
