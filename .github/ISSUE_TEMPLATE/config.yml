# Actionable work uses the forms; questions and private security reports have separate routes.
blank_issues_enabled: false
contact_links:
  - name: General question or exploratory discussion
    url: https://github.com/sempods/sempods-kotlin/discussions
    about: >-
      Ask for help or explore an idea. Use an issue form for actionable design,
      planning, implementation or repository maintenance.
  - name: Security vulnerability — do not open an issue
    url: https://github.com/sempods/sempods-kotlin/security/policy
    about: >-
      Never report a vulnerability in a public issue. Read SECURITY.md and report
      privately.
