[versions]
awsSdk = "2.54.2"
coroutines = "1.11.0"
jackson = "2.22.2"
jersey = "4.0.2"
ktor = "3.5.2"
mongodb = "5.10.0"
okhttp = "5.5.0"
morphia = "2.5.3"
rdf4j = "6.0.1"
slf4j = "2.0.18"

[libraries]
jerseyBom = { module = "org.glassfish.jersey:jersey-bom", version.ref = "jersey" }
ktorBom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktorServerCore = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktorServerNetty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktorServerCallLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktorServerTestHost = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# `AttributeKey`, which `commons-ktor` names in the signature of its trace binding.
ktorUtils = { module = "io.ktor:ktor-utils", version.ref = "ktor" }
rdf4jBom = { module = "org.eclipse.rdf4j:rdf4j-bom", version.ref = "rdf4j" }
slf4jBom = { module = "org.slf4j:slf4j-bom", version.ref = "slf4j" }

# The HTTP engine under `:sempods-client` — and therefore under everything that dials a pod — and
# under `:commons-okhttp` as well. The two hold separate clients on purpose
# (`docs/pod-client.md` §"Two OkHttp clients in one process").
# Declared explicitly rather than taken transitively through `ktor-client-okhttp`: `:sempods-client`
# has no Ktor and must not have its engine version decided by the Ktor BOM of a different module.
# OkHttp rather than the JDK client because its `Dns` hook is where SSRF resolve-and-pin can be
# expressed at all — see `org.sempods.client.net.VettingDns` and `docs/pod-client.md`.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# S3, for `:sempods-media-s3`. The AWS SDK is the reference implementation of the *protocol* — Garage,
# R2, SeaweedFS and AWS itself all speak it — so the vendor in the group id says nothing about which
# store a deployment runs. `apacheClient` pins the sync HTTP layer explicitly, so the client this code
# uses is the one named here rather than whichever the SDK discovers.
# TODO: `netty-nio-client` still arrives transitively with `s3`, for an async client nothing here
#  uses — it is now the *only* Netty in the pod-server image, so an `exclude` would remove that whole
#  stack. Not done here because `S3PodMediaStoreTest` skips without a Garage layout, so a break would
#  not be caught by a default `./gradlew test`.
awsS3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
awsApacheClient = { module = "software.amazon.awssdk:apache-client", version.ref = "awsSdk" }

commonsEmailJakarta = "org.apache.commons:commons-email2-jakarta:2.0.0-M1"
angusMail = "org.eclipse.angus:jakarta.mail:2.0.5"
angusActivation = "org.eclipse.angus:angus-activation:2.0.3"

# Coroutines. `commons-ktor` puts `ThreadContextElement` in a public signature, so it is `api`
# there; elsewhere it is an implementation detail. Ktor pins the same version — this catalog entry
# exists to name the artifact, not to decide the version, and the two must not drift.
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Ktor's buffers, reached directly where a response body is streamed rather than read whole.
kotlinxIoCore = "org.jetbrains.kotlinx:kotlinx-io-core:0.9.1"

# The Jetty container `JaxRsServerModule` builds by hand — `Server`, `ServerConnector`,
# `GzipHandler`, `VirtualThreadPool`. It arrives with `jerseyJettyHttp`, and is named because that
# module's code names it.
jettyServer = "org.eclipse.jetty:jetty-server:12.0.27"
jettyUtil = "org.eclipse.jetty:jetty-util:12.0.27"

commonsText = "org.apache.commons:commons-text:1.15.0"
commonsValidator = "commons-validator:commons-validator:1.11.0"
bouncycastle = "org.bouncycastle:bcprov-jdk18on:1.85.2"

googleApiClient = "com.google.api-client:google-api-client:2.9.0"
owaspHtmlSanitizer = "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260313.1"

guice = "com.google.inject:guice:7.0.0"
# The type that shows up in this repository's public signatures is `JsonNode`, and it lives here.
# Named on its own rather than reached through `jackson` or `jacksonKotlin` below, both of which
# merely depend on it: a module whose API speaks `JsonNode` has to say so, or a consumer compiling
# against the published jar depends on those two keeping a dependency they never promised.
jacksonDatabind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# The `java.time` codecs, and the Kotlin module. Both are registrations on an `ObjectMapper`, not
# types anything names — so both are usually `runtimeOnly`.
jackson = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jacksonKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
# The JAX-RS and injection annotations `commons-jaxrs` puts in its own signatures. They arrive with
# Jersey either way; declared because `BaseEndpoint` and `ApiException` name them, and a consumer
# compiling against `commons-jaxrs` needs them without being told to add Jersey.
jakartaWsRsApi = "jakarta.ws.rs:jakarta.ws.rs-api:4.0.0"
jakartaInjectApi = "jakarta.inject:jakarta.inject-api:2.0.1"
jerseyHk2 = { module = "org.glassfish.jersey.inject:jersey-hk2", version.ref = "jersey" }
jerseyServer = { module = "org.glassfish.jersey.core:jersey-server", version.ref = "jersey" }
jerseyJettyHttp = { module = "org.glassfish.jersey.containers:jersey-container-jetty-http", version.ref = "jersey" }
jerseyJsonJackson = { module = "org.glassfish.jersey.media:jersey-media-json-jackson", version.ref = "jersey" }
jwt = "com.nimbusds:nimbus-jose-jwt:10.9.1"
# The OAuth/OIDC message layer, from the same house as `jwt` above. Parsing and building
# protocol messages only — storage, client policy and identity derivation stay ours.
oidcSdk = "com.nimbusds:oauth2-oidc-sdk:11.38.2"
# Logging. The facade is what every module compiles against; the binding is what exactly one
# artifact per process supplies. Keeping them apart is what lets `sempods-client` and the other
# publishable modules ship without forcing logback on a consumer — see `docs/logging.md`.
kotlinLogging = "io.github.oshai:kotlin-logging-jvm:8.0.4"
logbackClassic = "ch.qos.logback:logback-classic:1.6.3"
mongodb = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
# `ObjectId` and `Document`. Separate from the driver above because they are in public signatures
# here — `PodMediaRef` speaks `ObjectId`, and `:sempods-server` names it in some fifty of them (#12)
# — so the modules that expose them export this artifact rather than the whole driver.
bson = { module = "org.mongodb:bson", version.ref = "mongodb" }
morphiaCore = { module = "dev.morphia.morphia:morphia-core", version.ref = "morphia" }
morphiaKotlin = { module = "dev.morphia.morphia:morphia-kotlin", version.ref = "morphia" }
thymeleaf = "org.thymeleaf:thymeleaf:3.1.5.RELEASE"
webPush = "nl.martijndwars:web-push:5.1.2"
slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4jJul = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }

# `Model`, `IRI`, `Resource`, `Value` — the interfaces the pod contract names in its own public
# signatures, and the artifact they are actually in. `rdf4j-model` beside it carries their
# implementations (`LinkedHashModel`, `SimpleValueFactory`, `Values`); the two were one declaration
# until the analysis pointed out that the exported type does not live in the exported artifact.
rdf4jModelApi = { module = "org.eclipse.rdf4j:rdf4j-model-api", version.ref = "rdf4j" }
rdf4jModel = { module = "org.eclipse.rdf4j:rdf4j-model", version.ref = "rdf4j" }
rdf4jModelVocabulary = { module = "org.eclipse.rdf4j:rdf4j-model-vocabulary", version.ref = "rdf4j" }
# The query surface `PodRepository` and the SPARQL sandbox speak: parsed queries, datasets, the
# algebra the context rewriter walks, and the transaction isolation levels it opens with.
rdf4jQuery = { module = "org.eclipse.rdf4j:rdf4j-query", version.ref = "rdf4j" }
rdf4jQueryparserApi = { module = "org.eclipse.rdf4j:rdf4j-queryparser-api", version.ref = "rdf4j" }
rdf4jQueryalgebraModel = { module = "org.eclipse.rdf4j:rdf4j-queryalgebra-model", version.ref = "rdf4j" }
rdf4jQueryresultioApi = { module = "org.eclipse.rdf4j:rdf4j-queryresultio-api", version.ref = "rdf4j" }
rdf4jRepositoryApi = { module = "org.eclipse.rdf4j:rdf4j-repository-api", version.ref = "rdf4j" }
rdf4jRioApi = { module = "org.eclipse.rdf4j:rdf4j-rio-api", version.ref = "rdf4j" }
rdf4jSailApi = { module = "org.eclipse.rdf4j:rdf4j-sail-api", version.ref = "rdf4j" }
rdf4jCommonTransaction = { module = "org.eclipse.rdf4j:rdf4j-common-transaction", version.ref = "rdf4j" }
rdf4jRioJsonld = { module = "org.eclipse.rdf4j:rdf4j-rio-jsonld", version.ref = "rdf4j" }
rdf4jRioNquads = { module = "org.eclipse.rdf4j:rdf4j-rio-nquads", version.ref = "rdf4j" }
rdf4jRepoSail = { module = "org.eclipse.rdf4j:rdf4j-repository-sail", version.ref = "rdf4j" }
rdf4jSailMemory = { module = "org.eclipse.rdf4j:rdf4j-sail-memory", version.ref = "rdf4j" }
rdf4jSparqlJson = { module = "org.eclipse.rdf4j:rdf4j-queryresultio-sparqljson", version.ref = "rdf4j" }

awaitility = "org.awaitility:awaitility:4.3.0"
junit = "org.junit.jupiter:junit-jupiter:6.1.3"
kotlinTestJunit5 = "org.jetbrains.kotlin:kotlin-test-junit5:2.4.10"
mockk = "io.mockk:mockk:1.14.11"
mockServer = "org.mock-server:mockserver-netty-no-dependencies:7.6.0"

[bundles]
security = ["bouncycastle", "jwt"]
# The facade — for every module, library and application alike. One artifact: kotlin-logging is
# what this repository's code names, and slf4j-api is a `compile`-scope dependency of it, so it
# arrives with it and needs no second line. The exception is `:commons`, whose `LoggingInitializer`
# names `org.slf4j` types itself and therefore declares `slf4jApi` on its own.
logging = ["kotlinLogging"]
# The binding. `runtimeOnly`, and only in an artifact that owns a `main` — a library that declares
# this decides for its consumers, which is not its call. The JUL bridge is deliberately *not* here:
# it is not a binding, and it belongs to `:commons`, the module whose `LoggingInitializer` installs it.
loggingBinding = ["logbackClassic"]
email = ["commonsEmailJakarta", "angusMail", "angusActivation"]
mongoMorphia = ["mongodb", "morphiaCore", "morphiaKotlin"]
webPush = ["bouncycastle", "webPush"]
# What RDF4J needs on a *runtime* classpath and on nobody's compile classpath: the parsers and
# writers `Rio` finds by `ServiceLoader`, and the store behind a repository. Nothing names a type
# from any of them, which is why this is one `runtimeOnly` line in the modules that take it whole —
# `:sempods-server` needs a compile-time say in which sail it opens and so declares its pieces
# itself.
rdf4j = [
  "rdf4jRioJsonld",
  "rdf4jRioNquads",
  "rdf4jRepoSail",
  "rdf4jSailMemory",
  "rdf4jSparqlJson",
]
# The test stack every module has: the JUnit platform, the Kotlin assertions on top of it, and
# MockK. `awaitility` and `mockServer` are deliberately *not* here — two modules poll for a
# condition and three drive a mock HTTP server, and the other eleven were carrying both because
# they came in the same line.
test = ["junit", "kotlinTestJunit5", "mockk"]
