<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title}">Access saved</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7; color: #1d1d1f; line-height: 1.5; min-height: 100vh;
      display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem;
    }
    .card {
      background: #fff; border-radius: 12px; max-width: 540px; width: 100%; padding: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 4px 12px rgba(0,0,0,.06);
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: .5rem; }
    p { font-size: .9375rem; color: #3a3a3c; }
    ul { margin-top: .5rem; padding-left: 1.25rem; font-size: .875rem; color: #6e6e73; word-break: break-all; }
  </style>
</head>
<body>
<!-- Every service-consent answer that is not a redirect: the owner decided on a link without a
     return address, or the page could not be acted on. -->
<div class="card">
  <h1 id="title" th:text="${title}">Access saved</h1>
  <p id="message" th:text="${message}">You can close this page.</p>
  <th:block th:if="${!created.isEmpty()}">
    <p>These contexts were created. They stay private, and no service reaches them:</p>
    <ul id="created">
      <li th:each="context : ${created}" th:text="${context}">https://pod.example/apps/syncer</li>
    </ul>
  </th:block>
</div>
</body>
</html>
