<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authorize App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .consent-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 4px 12px rgba(0,0,0,.06);
      max-width: 540px;
      width: 100%;
      overflow: hidden;
    }

    .consent-header {
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid #e5e5e7;
    }

    .consent-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .app-info {
      margin-top: .5rem;
      font-size: .875rem;
      color: #6e6e73;
      word-break: break-all;
    }

    .user-info {
      margin-top: .25rem;
      font-size: .875rem;
      color: #6e6e73;
      word-break: break-all;
    }

    .btn-link {
      padding: 0;
      border: none;
      background: none;
      color: #0071e3;
      font: inherit;
      cursor: pointer;
    }

    .btn-link:hover {
      text-decoration: underline;
    }

  </style>
  <style th:replace="~{grant-selection :: styles}"></style>
  <style>
    .consent-footer {
      padding: 1rem 1.5rem 1.5rem;
      border-top: 1px solid #e5e5e7;
      display: flex;
      gap: .75rem;
      justify-content: flex-end;
    }

    .btn {
      padding: .5rem 1.25rem;
      border-radius: 8px;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .15s, opacity .15s;
    }

    .btn-primary {
      background: #0071e3;
      color: #fff;
    }

    .btn-primary:hover {
      background: #0077ed;
    }

    .btn-secondary {
      background: #e5e5e7;
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background: #d2d2d7;
    }

    .empty-state {
      padding: 2rem 1.5rem;
      text-align: center;
      color: #6e6e73;
      font-size: .9375rem;
    }

    /* R7: Public-Read consent section */
    .public-read-section {
      padding: 1rem 1.5rem;
      border-top: 1px solid #e5e5e7;
      border-bottom: 1px solid #e5e5e7;
      background: #fafafc;
    }

    .public-read-section h2 {
      font-size: .875rem;
      font-weight: 600;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .75rem;
    }

    .public-read-toggle {
      display: flex;
      align-items: flex-start;
      gap: .625rem;
      padding: .75rem;
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .public-read-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0071e3;
      cursor: pointer;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .public-read-toggle .text {
      font-size: .9375rem;
      color: #1d1d1f;
    }

    .public-read-toggle .description {
      display: block;
      font-size: .8125rem;
      color: #6e6e73;
      margin-top: .125rem;
    }

    .public-context-list {
      margin-top: .625rem;
      padding-left: 1.75rem;
      max-height: 8rem;
      overflow-y: auto;
    }

    .public-context-list li {
      list-style: disc;
      font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
      font-size: .75rem;
      color: #86868b;
      word-break: break-all;
      margin-bottom: .125rem;
    }

  </style>
</head>
<body>
<div class="consent-card">
  <form id="consentForm" method="post" th:action="${consentAction}">
    <input type="hidden" name="csrf" th:value="${csrfToken}"/>

    <div class="consent-header">
      <h1><span th:text="${clientName}">Claude Code</span> wants access to your pod</h1>
      <div class="app-info" th:if="${clientName != clientId}">
        <span th:text="${clientId}">dyn:abc123</span>
      </div>
      <div class="user-info">
        Signed in as <strong th:text="${webId}">https://id.sempods.org/e/abc</strong>
        <!-- Ends everything the person holds on this pod: every sign-in and every app's connection.
             The grants stay, so the dialog says so. Confirmed, like the disconnect below. -->
        ·
        <button type="submit"
                class="btn-link"
                id="signOutBtn"
                name="action"
                value="signout"
                formnovalidate
                onclick="return confirm('Sign out of this pod everywhere? Your sign-in ends in every browser, and every app connected to this pod loses its connection right away and has to be connected again. The access you granted stays as it is.')">
          Sign out everywhere
        </button>
      </div>
    </div>

    <!-- The management screen's whole question. Offered only where the request asked for it, and
         never pre-ticked: a capability the person did not go looking for is not one they approve
         by leaving a box as they found it. Alone on the screen. It adds no grant: a service is
         given contexts only at the consent that names it. -->
    <div class="public-read-section" th:if="${managementRequested}">
      <h2>Manage the apps installed on this pod</h2>
      <label class="public-read-toggle">
        <input type="checkbox"
               id="managementToggle"
               name="scope"
               th:value="${managementScope}"/>
        <span class="text">
          Let <th:block th:text="${clientName}">this app</th:block> see, re-key and remove the apps
          installed on this pod, for the next hour.
          <span class="description">
            It sees their names, when they were installed and last used, and what they may reach.
            It can take access away from an app or remove it. It can also issue an app a new secret
            and keep it. With that secret it acts as that app and has all of its access, also after
            this hour. It cannot give an app more access.
          </span>
        </span>
      </label>
    </div>

    <!-- The owner's own authority over the registry, on the terms of the two above: offered only
         where asked for, never pre-ticked, alone on the screen. Without it an app creates and
         deletes only the contexts it was granted `manage` on. -->
    <div class="public-read-section" th:if="${contextsManagementRequested}">
      <h2>Manage the contexts of this pod</h2>
      <label class="public-read-toggle">
        <input type="checkbox"
               id="contextsManagementToggle"
               name="scope"
               th:value="${contextsManagementScope}"/>
        <span class="text">
          Let <th:block th:text="${clientName}">this app</th:block> create and delete any context on
          this pod, for the next hour.
          <span class="description">
            Deleting a context deletes everything stored in it and every access granted to it, for
            you and for every app. It cannot read what a context holds, but it can delete all of it
            with the context.
          </span>
        </span>
      </label>
    </div>

    <!-- R7 (additive model, 2026-05-07): Public-Read is a normal additive
         scope. Visible when the pod has at least one server-defined
         public-read context. Default checked — most users want public-read
         alongside any per-context grants. The user can uncheck it to keep
         the grant strictly per-context. No mutual-exclusivity. -->
    <div class="public-read-section" th:if="${publicReadAvailable}">
      <h2>Public-read access</h2>
      <label class="public-read-toggle">
        <input type="checkbox"
               id="publicReadToggle"
               name="scope"
               th:value="${publicReadScope}"
               th:checked="${publicReadPreselected}"/>
        <span class="text">
          Include read-only access to this pod's public contexts.
          <span class="description">
            The app will be able to read all current and future
            public-read contexts on this pod. This is in addition to any
            per-context grants you select below. Untick it to keep the
            grant strictly per-context.
          </span>
        </span>
      </label>
      <ul class="public-context-list" th:if="${!publicContexts.isEmpty()}">
        <li th:each="ctx : ${publicContexts}" th:text="${ctx}">https://pod.example.com/public</li>
      </ul>
    </div>

    <!-- Asked as a duration, and it has to be. Both answers let the app renew its own access, so a
         question about acting unattended has no "no" left to give — and this server could not police
         one anyway: it sees token-endpoint traffic, not presence, and a pinned tab or a service
         worker produces that traffic with nobody there. Phrasing it as "may it act without you"
         reads better and is therefore tempting; it would promise something nothing here enforces.

         Both halves name a number, because both are durations and both are enforced: an access token
         is capped against its family's deadline, so neither sentence owes a "and up to an hour
         more". The numbers are the deployment's and come from `PodRefreshTokenStore.termsOf`, the
         terms the exchange mints with, so the copy names whatever a deployment configured.

         What the long answer buys is time, not capability. The short answer syncs on a schedule
         perfectly well, so capability is not what separates the two.

         Ticked when the client asked for it, or when this person granted it here before; what the
         client asks only preselects, the tick is what decides.

         Absent from a privileged screen. The authority granted there lasts an hour; a box that
         could keep it connected would turn it into a renewable one, and the server refusing that
         afterwards is not the same as never offering it. -->
    <div class="public-read-section" th:if="${lifetimeAvailable}">
      <h2>How long this app stays connected</h2>
      <label class="public-read-toggle">
        <input type="checkbox"
               id="durableToggle"
               name="durable"
               value="1"
               th:checked="${durablePreselected}"/>
        <span class="text">
          Keep this app connected for up to <th:block th:text="${durableAbsolute}">180 days</th:block>.
          <span class="description">
            Ticked, it stays connected for up to <th:block th:text="${durableAbsolute}">180 days</th:block>
            — or until it goes <th:block th:text="${durableIdle}">90 days</th:block> unused.
            Unticked, for up to <th:block th:text="${sessionAbsolute}">7 days</th:block>
            — or until it goes <th:block th:text="${sessionIdle}">4 days</th:block> unused. Either way it
            renews its own access until then, and either way you can disconnect it here at
            any time.
          </span>
        </span>
      </label>
    </div>

    <div th:replace="~{grant-selection :: contexts}"></div>

    <div class="empty-state" th:if="${contexts.isEmpty() && !isOwner}">
      No contexts available on this pod.
    </div>

    <th:block th:replace="~{grant-selection :: creation}"></th:block>

    <div class="consent-footer">
      <!-- Only where there is something to remove: offering it on a first authorization would
           report a disconnect of nothing. Named and confirmed, so nobody ends an app's access
           while trying to dismiss this page. -->
      <button type="submit"
              th:if="${disconnectAvailable}"
              class="btn btn-secondary"
              id="disconnectBtn"
              name="action"
              value="disconnect"
              formnovalidate
              onclick="return confirm('Remove this app\u2019s access to your pod? It loses every grant it holds, and any connection it kept open stops working.')">
        Remove access
      </button>
      <!-- A submission, so the app hears that the person left: `access_denied`, and nothing changes. -->
      <button type="submit" class="btn btn-secondary" id="cancelBtn" name="action" value="cancel"
              formnovalidate>Cancel</button>
      <button type="submit" class="btn btn-primary" id="authorizeBtn">Authorize</button>
    </div>
  </form>
</div>

<th:block th:if="${contextCreationAvailable}">
  <script th:replace="~{grant-selection :: creation-script}"></script>
</th:block>
</body>
</html>
