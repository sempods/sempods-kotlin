# The Gradle daemon's heap, not the test JVMs' — those are sized by `maxHeapSize` on the `test`
# task in build.gradle.kts. The default 512m is what makes a wide configure phase, the Kotlin
# compiler and several parallel workers spend their time in GC instead of in work.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx4g -XX:MaxMetaspaceSize=1g

# Task-level parallelism across projects. The graph is wide — six leaf `commons*` modules and
# several independent suites that each boot their own server — so this is where the wall time is.
# It is only safe because every `test` task gets its own Mongo database and its own connector
# ports; see the `subprojects { tasks.test }` block in build.gradle.kts.
org.gradle.parallel=true

# How many test JVMs run at once. Left at the default (one per processor) this starts one JVM per
# core, each booting Jetty, an RDF4J store and a Mongo driver pool — and the suites that talk to a
# mock server over a socket start losing connections before their response arrives
# (`SempodsClientHttpTest`, 27 failures, all `SocketConnectionException`, all green when the module
# runs alone). Four is what the heavy suites want; the concurrency that is cheap lives inside a
# JVM, not between them.
org.gradle.workers.max=4

# `:commons:test` need not run again because a module downstream of it changed.
org.gradle.caching=true

# Not the configuration cache. It needs its own trial run — the Jib plugin is the likely objector.
# Check with `./gradlew --configuration-cache help` before turning it on here.

# The published coordinates, and the one place the version is written. Gradle maps `group` and
# `version` from here onto every project, so a release is one edit rather than sixteen.
#
# One version for the whole repository, deliberately: the modules are built, tested and released
# together, and a consumer that mixes `sempods-client` 0.2 with `sempods-model` 0.1 is holding a
# combination nothing ever ran. `sempods-bom` is what publishes that promise.
#
# `-SNAPSHOT` is the development state: mutable, republished on every build, and what
# eventer-backend follows. Dropping the suffix is what makes a release — an immutable version
# someone else can pin — after which this bumps to the next minor and regains the suffix.
group=org.sempods
version=0.1.0-SNAPSHOT
