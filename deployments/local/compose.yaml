# The only infrastructure a pod server needs.
#
#   docker compose -f deployments/local/compose.yaml up -d
#
# The port is 27018 rather than 27017 on purpose: it is the address the server falls back to in
# development, and it keeps a local pod server off a MongoDB you may already run for something
# else.
services:

  mongo:
    image: mongo:8.0.1
    ports:
      - "27018:27017"
    volumes:
      - sempods-mongo:/data/db

  # Optional — supplies a runtime for the natural-language layer. Start it with:
  #
  #   docker compose -f deployments/local/compose.yaml --profile ai up -d
  #
  # Pull a model once the container is up:
  #
  #   docker compose -f deployments/local/compose.yaml exec ollama ollama pull qwen3.5:4b
  #
  # Enable the pod server's AI routes separately: set AI_PROVIDER=ollama in
  # deployments/local/env/local.env before starting the server. Unset, blank or disabled leaves
  # those routes unregistered; starting this profile and pulling a model does not enable them.
  # The test suite needs no Ollama runtime.
  ollama:
    profiles: [ai]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - sempods-ollama:/root/.ollama

volumes:
  sempods-mongo:
  sempods-ollama:
